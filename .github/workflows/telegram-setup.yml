name: Telegram Setup

on:
  workflow_dispatch:

permissions: {}

jobs:
  find-channel:
    runs-on: ubuntu-latest
    steps:
      - name: Find channel ID
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          token = os.environ["BOT_TOKEN"]
          url = f"https://api.telegram.org/bot{token}/getUpdates"
          request = urllib.request.Request(
              url,
              data=json.dumps({
                  "allowed_updates": ["channel_post"],
                  "timeout": 0
              }).encode(),
              headers={"Content-Type": "application/json"}
          )

          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  result = json.load(response)
          except Exception:
              raise SystemExit("Telegram request failed; check bot token and webhook settings.")

          channels = {}
          for update in result.get("result", []):
              post = update.get("channel_post", {})
              chat = post.get("chat", {})
              if chat.get("type") == "channel":
                  channels[chat["id"]] = chat.get("title", "")

          for chat_id, title in channels.items():
              print(f"Channel: {title} | CHAT_ID: {chat_id}")

          if not channels:
              print("No channel found. Publish a new channel post and run again.")
          PY
