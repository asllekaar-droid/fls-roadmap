name: FLS QT Roadmap

on:
  schedule:
    # 03:00 UTC = 06:30 Tehran. GitHub may start scheduled runs late.
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'auto: Saturday weekly, weekdays daily, Sunday skip'
        type: choice
        options: [auto, daily, weekly]
        default: auto
      report_date:
        description: 'Optional YYYY-MM-DD; empty = today in Tehran'
        type: string
        default: ''
      send_to_telegram:
        description: 'Send the generated image to your Telegram channel'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: fls-qt-roadmap
  cancel-in-progress: false

jobs:
  roadmap:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-dejavu-core
          python -m pip install -r requirements.txt
      - name: Verify time engine
        run: python -m unittest test_engine.py
      - name: Generate and deliver roadmap
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPORT_MODE: ${{ inputs.mode || 'auto' }}
          REPORT_DATE: ${{ inputs.report_date }}
          SEND: ${{ github.event_name == 'schedule' || inputs.send_to_telegram }}
        run: |
          args=(--mode "$REPORT_MODE")
          if [ -n "$REPORT_DATE" ]; then args+=(--date "$REPORT_DATE"); fi
          if [ "$SEND" = "true" ]; then args+=(--send); fi
          python roadmap.py "${args[@]}"
      - name: Save generated images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FLS-QT-Roadmaps
          path: output/*.png
          if-no-files-found: ignore
          retention-days: 14
