name: FLS QT Roadmap

on:
  schedule:
    # Daily New York 18:00: DST-aware selection between the two UTC slots.
    - cron: '0 22 * * *'
    - cron: '0 23 * * *'
    # New York midnight: calendar-month MC boundary checks.
    - cron: '0 4 * * *'
    - cron: '0 5 * * *'
    # Weekly Saturday 06:30 Tehran.
    - cron: '0 3 * * 6'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Manual mode; scheduled daily reports use the next New York trading date'
        type: choice
        options: [auto, daily, weekly, monthly]
        default: auto
      report_date:
        description: 'Optional YYYY-MM-DD; empty = today in Tehran'
        type: string
        default: ''
      send_to_telegram:
        description: 'Send the generated image to your Telegram channel'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: fls-qt-roadmap
  cancel-in-progress: false

jobs:
  roadmap:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-dejavu-core
          python -m pip install -r requirements.txt
      - name: Verify time engine
        run: python -m unittest test_engine.py
      - name: Generate and deliver roadmap
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPORT_MODE: ${{ inputs.mode || 'auto' }}
          REPORT_DATE: ${{ inputs.report_date }}
          SEND: ${{ github.event_name == 'schedule' || inputs.send_to_telegram }}
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
        run: |
          python - <<'PYTHON'
          import os
          import subprocess
          import sys
          from datetime import datetime, timedelta, timezone
          from zoneinfo import ZoneInfo

          mode = os.environ['REPORT_MODE']
          report_date = os.environ.get('REPORT_DATE', '').strip()
          if os.environ['EVENT_NAME'] == 'schedule':
              cron = os.environ['SCHEDULE_CRON']
              now = datetime.now(timezone.utc)
              if cron == '0 3 * * 6':
                  mode = 'weekly'
                  report_date = datetime.now(ZoneInfo('Asia/Tehran')).date().isoformat()
              else:
                  from roadmap import quarters
                  hour = int(cron.split()[1])
                  nominal = now.replace(hour=hour, minute=0, second=0, microsecond=0)
                  if nominal > now:
                      nominal -= timedelta(days=1)
                  local = nominal.astimezone(ZoneInfo('America/New_York'))
                  target_hour = 18 if hour in (22, 23) else 0
                  if local.hour != target_hour:
                      print('Skipped inactive DST slot.')
                      sys.exit(0)
                  before = quarters(local - timedelta(seconds=1))['MC']
                  after = quarters(local)['MC']
                  if before in (4, 0) and after != before:
                      monthly_args = [sys.executable, 'roadmap.py', '--mode', 'monthly',
                                      '--date', local.date().isoformat()]
                      if os.environ['SEND'] == 'true':
                          monthly_args += ['--send']
                      subprocess.run(monthly_args, check=True)
                  if local.hour != 18 or local.weekday() not in (6, 0, 1, 2, 3):
                      print('No daily WC report for this slot.')
                      sys.exit(0)
                  mode = 'daily'
                  report_date = (local.date() + timedelta(days=1)).isoformat()
          args = [sys.executable, 'roadmap.py', '--mode', mode]
          if report_date:
              args += ['--date', report_date]
          if os.environ['SEND'] == 'true':
              args += ['--send']
          subprocess.run(args, check=True)
          PYTHON
      - name: Save generated images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FLS-QT-Roadmaps
          path: output/*.png
          if-no-files-found: ignore
          retention-days: 14
