name: FLS QT Roadmap

on:
  schedule:
    # New York 00:00; active UTC slot follows DST.
    # Saturday sends MC + upcoming Monday WC Q1.
    # Other midnight runs preserve existing monthly boundary checks.
    - cron: '0 4 * * *'
    - cron: '0 5 * * *'
    # New York Monday-Thursday 15:00: next day's WC Q2/Q3/Q4/X.
    - cron: '0 19 * * 1-4'
    - cron: '0 20 * * 1-4'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Manual mode; scheduled daily reports use the next New York trading date'
        type: choice
        options: [auto, daily, weekly, monthly]
        default: auto
      report_date:
        description: 'Optional YYYY-MM-DD; empty = today in Tehran'
        type: string
        default: ''
      send_to_telegram:
        description: 'Send the generated image to your Telegram channel'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: fls-qt-roadmap
  cancel-in-progress: false

jobs:
  roadmap:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-dejavu-core
          python -m pip install -r requirements.txt
      - name: Verify time engine
        run: python -m unittest test_engine.py
      - name: Generate and deliver roadmap
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPORT_MODE: ${{ inputs.mode || 'auto' }}
          REPORT_DATE: ${{ inputs.report_date }}
          SEND: ${{ github.event_name == 'schedule' || inputs.send_to_telegram }}
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
        run: |
          python - <<'PYTHON'
          import os
          import subprocess
          import sys
          from datetime import datetime, timedelta, timezone
          from zoneinfo import ZoneInfo

          mode = os.environ['REPORT_MODE']
          report_date = os.environ.get('REPORT_DATE', '').strip()
          reports = [(mode, report_date)]
          if os.environ['EVENT_NAME'] == 'schedule':
              cron = os.environ['SCHEDULE_CRON']
              now = datetime.now(timezone.utc)
              hour = int(cron.split()[1])
              nominal = now.replace(hour=hour, minute=0, second=0, microsecond=0)
              if nominal > now:
                  nominal -= timedelta(days=1)
              # Recover the scheduled weekday even if a queued run starts after midnight.
              if hour in (19, 20):
                  while nominal.weekday() not in (0, 1, 2, 3):
                      nominal -= timedelta(days=1)
              local = nominal.astimezone(ZoneInfo('America/New_York'))
              target_hour = 15 if hour in (19, 20) else 0
              if local.hour != target_hour:
                  print('Skipped inactive DST slot.')
                  sys.exit(0)
              reports = []
              if target_hour == 15:
                  reports.append(('daily', (local.date() + timedelta(days=1)).isoformat()))
              else:
                  from roadmap import quarters
                  before = quarters(local - timedelta(seconds=1))['MC']
                  after = quarters(local)['MC']
                  if before in (4, 0) and after != before:
                      reports.append(('monthly', local.date().isoformat()))
                  if local.weekday() == 5:
                      reports.append(('weekly', local.date().isoformat()))
                      reports.append(('daily', (local.date() + timedelta(days=2)).isoformat()))
              if not reports:
                  print('No report due in this slot.')
          for mode, report_date in reports:
              args = [sys.executable, 'roadmap.py', '--mode', mode]
              if report_date:
                  args += ['--date', report_date]
              if os.environ['SEND'] == 'true':
                  args += ['--send']
              subprocess.run(args, check=True)
          PYTHON
      - name: Save generated images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FLS-QT-Roadmaps
          path: output/*.png
          if-no-files-found: ignore
          retention-days: 14
